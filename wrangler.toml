# Cloudflare Worker（含靜態資產）設定 — `wrangler deploy` 會部署：
#   - dist/ 的靜態資產（SPA，未命中路徑 fallback 到 index.html）
#   - worker/ 的 API（/api/* 會先進 Worker，見 assets.run_worker_first）
#
# 首次設定：
#   1. `npx wrangler d1 create tpomps-history`，把回傳的 database_id 填到下方
#   2. `pnpm db:migrate:remote` 建立資料表
#   3. 在下方 [vars] 填入 GOOGLE_CLIENT_ID 與 AI 設定（GOOGLE_CLIENT_SECRET 與
#      AI_API_KEY 是密鑰，用 `wrangler secret put` 設定，不要寫在這裡）

name = "tpomps-score-calculator"
main = "worker/index.ts"
compatibility_date = "2026-10-17"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "tpomps-history"
database_id = "b33a6d9a-4f65-497e-bdf0-15bcd24c2c50"

[vars]
# Google OAuth client ID（公開值）。建立方式見 README「Google 登入」一節；
# 對應的 client secret 以 GOOGLE_CLIENT_SECRET 名義設為 Worker secret。
GOOGLE_CLIENT_ID = "1002663246696-8q0rf526d1ms800v01k7q2hcdlrqg3d0.apps.googleusercontent.com"
# OpenAI 相容 API（POST {AI_BASE_URL}/chat/completions）的設定，用於成績表照片辨識
AI_BASE_URL = "https://api.kimi.com/coding/v1"
AI_MODEL = "kimi-for-coding-highspeed"
