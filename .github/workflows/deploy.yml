name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # wrangler.toml（含 D1 綁定與 [vars]）與 functions/ 目錄決定部署內容與設定；
      # 使用 repo 內鎖定版本的 wrangler（wrangler-action 預設裝的舊版不支援
      # Pages 的 wrangler.toml 設定）。CLOUDFLARE_API_TOKEN 需要
      # Cloudflare Pages 編輯 + D1 編輯權限。
      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 把 AI API 密鑰同步為 Pages secret（未設定 AI_API_KEY secret 時自動略過）。
      # 也可以只在本機手動執行一次：
      #   pnpm exec wrangler pages secret put AI_API_KEY --project-name tpomps-score-calculator
      - name: Sync AI_API_KEY Pages secret
        run: |
          if [ -n "$AI_API_KEY" ]; then
            printf '%s' "$AI_API_KEY" | pnpm exec wrangler pages secret put AI_API_KEY --project-name tpomps-score-calculator
          else
            echo "AI_API_KEY secret 未設定，略過同步"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
