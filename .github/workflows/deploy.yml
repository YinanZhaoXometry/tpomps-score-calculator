name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # wrangler.toml（Worker + 靜態資產 + D1 綁定 + [vars]）決定部署內容與設定；
      # 使用 repo 內鎖定版本的 wrangler。CLOUDFLARE_API_TOKEN 需要
      # Cloudflare Workers Scripts 編輯 + D1 編輯權限。
      # 注意：若 Cloudflare dashboard 的 Workers Builds 也連結了此 repo，會重複部署，
      # 建議擇一（停用此 job，或 Settings → Builds → Disconnect）。
      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 把密鑰同步為 Worker secret（未設定的自動略過）。也可以只在本機手動執行一次：
      #   pnpm exec wrangler secret put GOOGLE_CLIENT_SECRET / AI_API_KEY
      - name: Sync Worker secrets
        run: |
          sync_secret() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | pnpm exec wrangler secret put "$1"
            else
              echo "$1 secret 未設定，略過同步"
            fi
          }
          sync_secret GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          sync_secret AI_API_KEY "$AI_API_KEY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
